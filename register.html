
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Ahameed Buzz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
  <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Register on Ahameed Buzz</h2>

  <div class="space-y-4">
    <input type="text" id="username" placeholder="Username" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-400"/>
    <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-400"/>
    <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-400"/>
    <button id="registerBtn" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">Register</button>
    <p id="errorMsg" class="text-red-600 text-sm text-center mt-2 hidden"></p>
  </div>

  <div class="text-center mt-4 text-sm text-gray-600">
    Already have an account? <a href="login.html" class="text-green-600 hover:underline">Login</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4MIC9dma_UEcCCSaseCr0PoDdTeW_4UM",
    authDomain: "ahameed-playz.firebaseapp.com",
    projectId: "ahameed-playz",
    storageBucket: "ahameed-playz.firebasestorage.app",
    messagingSenderId: "110673165622",
    appId: "1:110673165622:web:1f5bdc642d8c22f95cc797",
    measurementId: "G-G9T2VTCW23"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const registerBtn = document.getElementById("registerBtn");
  const errorMsg = document.getElementById("errorMsg");

  registerBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const username = document.getElementById("username").value.trim();

    if (!email || !password || !username) {
      errorMsg.textContent = "All fields are required.";
      errorMsg.classList.remove("hidden");
      return;
    }

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);

      const settingsRef = doc(db, "settings", "meta");
      const settingsSnap = await getDoc(settingsRef);

      let uidNumber = 1;
      if (settingsSnap.exists()) {
        uidNumber = (settingsSnap.data().userCount || 0) + 1;
        await updateDoc(settingsRef, { userCount: increment(1) });
      } else {
        await setDoc(settingsRef, { userCount: 1 });
      }

      await setDoc(doc(db, "users", cred.user.uid), {
        email: email,
        username: username,
        uidNumber: uidNumber,
        balance: 0
      });

      window.location.href = "home.html";
    } catch (error) {
      errorMsg.textContent = "Registration failed: " + error.message;
      errorMsg.classList.remove("hidden");
    }
  });
</script>

</body>
</html>
