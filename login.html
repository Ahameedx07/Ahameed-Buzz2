<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Ahameed Buzz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
  <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Login to Ahameed Buzz</h2>

  <div class="space-y-4">
    <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    <button id="loginBtn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Login</button>
    <p id="errorMsg" class="text-red-600 text-sm text-center mt-2 hidden"></p>
  </div>

  <div class="text-center mt-4 text-sm text-gray-600">
    <a href="reset.html" class="text-blue-600 hover:underline">Forgot password?</a><br/>
    Don’t have an account? <a href="register.html" class="text-blue-600 hover:underline">Register</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4MIC9dma_UEcCCSaseCr0PoDdTeW_4UM",
    authDomain: "ahameed-playz.firebaseapp.com",
    projectId: "ahameed-playz",
    storageBucket: "ahameed-playz.firebasestorage.app",
    messagingSenderId: "110673165622",
    appId: "1:110673165622:web:1f5bdc642d8c22f95cc797",
    measurementId: "G-G9T2VTCW23"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.classList.add("hidden");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "home.html";
    } catch (error) {
      errorMsg.textContent = "Login failed: " + error.message;
      errorMsg.classList.remove("hidden");
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "home.html";
    }
  });
</script>

</body>
</html>
