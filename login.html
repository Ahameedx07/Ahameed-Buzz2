
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Ahameed Buzz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(to right, #141e30, #243b55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      border: 2px solid transparent;
      background-clip: padding-box;
      animation: slideUp 0.6s ease-out;
    }
    @keyframes slideUp {
      0% { transform: translateY(50px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .login-box h2 {
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #00c9a7;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
    }
    input {
      background: #f8fafc;
      color: #1e293b;
    }
    button {
      background: #00c9a7;
      color: white;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover {
      background: #009e8d;
    }
    a {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login to Ahameed Buzz</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <p class="text-sm text-center mt-4">
      Forgot password? <a href="reset.html">Reset</a><br/>
      Don't have an account? <a href="register.html">Register</a>
    </p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4MIC9dma_UEcCCSaseCr0PoDdTeW_4UM",
    authDomain: "ahameed-playz.firebaseapp.com",
    projectId: "ahameed-playz",
    storageBucket: "ahameed-playz.firebasestorage.app",
    messagingSenderId: "110673165622",
    appId: "1:110673165622:web:1f5bdc642d8c22f95cc797",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        window.location.href = "home.html";
      })
      .catch((error) => {
        alert("Login failed: " + error.message);
      });
  });
</script>
</body>
</html>
