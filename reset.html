
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - Ahameed Buzz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-yellow-50 to-yellow-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
  <h2 class="text-2xl font-bold text-center text-yellow-700 mb-6">Reset Your Password</h2>

  <div class="space-y-4">
    <input type="email" id="resetEmail" placeholder="Enter your email" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"/>
    <button id="resetBtn" class="w-full bg-yellow-600 text-white py-2 rounded hover:bg-yellow-700 transition">Send Reset Link</button>
    <p id="statusMsg" class="text-center mt-2 text-sm hidden"></p>
  </div>

  <div class="text-center mt-4 text-sm text-gray-600">
    Back to <a href="login.html" class="text-yellow-600 hover:underline">Login</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4MIC9dma_UEcCCSaseCr0PoDdTeW_4UM",
    authDomain: "ahameed-playz.firebaseapp.com",
    projectId: "ahameed-playz",
    storageBucket: "ahameed-playz.firebasestorage.app",
    messagingSenderId: "110673165622",
    appId: "1:110673165622:web:1f5bdc642d8c22f95cc797",
    measurementId: "G-G9T2VTCW23"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const resetBtn = document.getElementById("resetBtn");
  const statusMsg = document.getElementById("statusMsg");

  resetBtn.addEventListener("click", async () => {
    const email = document.getElementById("resetEmail").value.trim();
    statusMsg.classList.remove("text-green-600", "text-red-600");
    statusMsg.classList.add("hidden");

    if (!email) {
      statusMsg.textContent = "Please enter your email address.";
      statusMsg.classList.add("text-red-600", "block");
      return;
    }

    try {
      await sendPasswordResetEmail(auth, email);
      statusMsg.textContent = "Password reset link sent. Check your email.";
      statusMsg.classList.remove("hidden");
      statusMsg.classList.add("text-green-600");
    } catch (error) {
      statusMsg.textContent = "Error: " + error.message;
      statusMsg.classList.remove("hidden");
      statusMsg.classList.add("text-red-600");
    }
  });
</script>

</body>
</html>
